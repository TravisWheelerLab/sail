[package]
name = "libsail"
version = "0.3.0"
description = "sequence analysis I/O library"
readme = "README.md"
exclude = ["CLAUDE.md"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["bioinformatics", "fasta", "stockholm", "p7hmm", "parser"]
categories = ["science", "parser-implementations"]

[features]
mmap = ["dep:memmap2"]

[dependencies]
indexmap = "2.10.0"
rand = "0.10.2"
memchr = "2.8"
memmap2 = { version = "0.9.11", optional = true }
