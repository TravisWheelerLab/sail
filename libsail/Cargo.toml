[package]
name = "libsail"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/TravisWheelerLab/sail"
description = "sequence analysis I/O library"

[lib]
name = "libsail"
path = "src/lib.rs"

[features]
mmap = ["dep:memmap2"]

[dependencies]
indexmap = "2.10.0"
rand = "0.10.2"
memchr = "2.8"
memmap2 = { version = "0.9.11", optional = true }
